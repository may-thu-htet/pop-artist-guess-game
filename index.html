<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pop Artist Guess Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Let's play a guessing game!!!</h2>
    <div class="container">
      <div class="title" id="title">
        <h4 id="artist">Words will appear when the start button is pressed!</h1>
      </div>

      <div class="game-body">
        <div class="buttonGp">
          <button class="start" id="start">Start</button>
          <button class="reveal" id="reveal">Reveal</button>
        </div>
        <div class="characters" id="characters"></div>
        <button class="result" id="result">Play first</button>
    </div>
</div>
<p class="lives" id="lives">No of lives remaining:</p>
<script src="index.js"></script>
  </body>
</html>
